[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "category-forge-onboard"
version = "0.3.0"
description = "Customer taxonomy, grading-policy and edge-config onboarding control plane for industrial garment sorting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
yc = [
  "supabase>=2.0",
  "posthog>=3.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
